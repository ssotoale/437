<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Boyle Heights Murals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Oswald:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <script type="importmap">
    {
      "imports": {
        "@unbndl/html": "https://unpkg.com/@unbndl/html"
      }
    }
    </script>
    <script type="module">
      import { define } from "@unbndl/html";
      import { MuralListElement } from "/js/mural-list.js";

      define({
        "mural-list": MuralListElement
      });
    </script>
  </head>
  <body>
    <header>
      <h1><svg class="icon"><use href="/icons/murals.svg#icon-painting" /></svg> Boyle Heights Murals</h1>
      <nav><a href="mural.html">Browse</a></nav>
      <label>
        <input type="checkbox" autocomplete="off" />
        Dark mode
      </label>
    </header>

    <mural-list src="/data/murals.json">
      <!-- contents will be replaced by fetched data -->
    </mural-list>

    <script type="module">
      document.querySelector('header label').onchange = function (event) {
        event.stopPropagation();
        event.currentTarget.dispatchEvent(
          new CustomEvent('darkmode:toggle', {
            bubbles: true,
            detail: { checked: event.target.checked }
          })
        );
      };

      document.body.addEventListener('darkmode:toggle', function (event) {
        if (event.detail.checked) {
          event.currentTarget.classList.add('dark-mode');
        } else {
          event.currentTarget.classList.remove('dark-mode');
        }
      });
    </script>
  </body>
</html>
