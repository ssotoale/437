<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Boyle Heights Murals</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,700;1,400&family=Oswald:wght@300;400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/page.css" />
    <script type="importmap">
    {
      "imports": {
        "@unbndl/auth": "https://unpkg.com/@unbndl/auth",
        "@unbndl/html": "https://unpkg.com/@unbndl/html",
        "@unbndl/view": "https://unpkg.com/@unbndl/view"
      }
    }
    </script>
    <script type="module">
      import { define } from "@unbndl/html";
      import { Auth } from "@unbndl/auth";
      import { MuralHeaderElement } from "/js/header.js";
      import { MuralListElement } from "/js/mural-list.js";

      define({
        "auth-provider": Auth.Provider,
        "mural-header": MuralHeaderElement,
        "mural-list": MuralListElement
      });
    </script>
  </head>
  <body>
    <auth-provider>
      <mural-header></mural-header>

      <main class="page">
        <mural-list src="/api/murals">
          <!-- contents will be replaced by fetched data -->
        </mural-list>
      </main>
    </auth-provider>
  </body>
</html>
